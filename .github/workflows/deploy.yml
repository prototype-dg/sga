name: deploy-sga-container-apps
on:
  push: { branches: [ main ] }
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: guard
        run: |
          if [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No AZURE_CREDENTIALS secret - skipping deploy (no-op run)."; fi
      - uses: azure/login@v2
        if: steps.guard.outputs.run == 'true'
        with: { creds: '${{ secrets.AZURE_CREDENTIALS }}' }
      - name: Provision + deploy middleware to Container Apps
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RG }}"; ACA_ENV="${{ vars.AZURE_ENV }}"; ACR="${{ vars.AZURE_ACR }}"; APP="${{ vars.AZURE_APP }}"
          az group create -n "$RG" -l "${{ vars.AZURE_LOC }}" --output none 2>/dev/null || true
          az acr create -g "$RG" -n "$ACR" --sku Basic --admin-enabled true --output none 2>/dev/null || true
          az acr login -n "$ACR"
          docker build -t "$ACR.azurecr.io/sga-middleware:${GITHUB_SHA::8}" apps/middleware
          docker push "$ACR.azurecr.io/sga-middleware:${GITHUB_SHA::8}"
          LAWS=$(az monitor log-analytics workspace show -g "$RG" -n "${ACA_ENV}-logs" --query id -o tsv 2>/dev/null || az monitor log-analytics workspace create -g "$RG" -n "${ACA_ENV}-logs" -l "${{ vars.AZURE_LOC }}" --query id -o tsv)
          az containerapp env create -n "$ACA_ENV" -g "$RG" -l "${{ vars.AZURE_LOC }}" --logs-workspace-id "$LAWS" --output none 2>/dev/null || true
          az containerapp create -n "$APP" -g "$RG" --environment "$ACA_ENV" --image "$ACR.azurecr.io/sga-middleware:${GITHUB_SHA::8}" --ingress external --target-port 3000 --output none 2>/dev/null || true
          az containerapp update -n "$APP" -g "$RG" --image "$ACR.azurecr.io/sga-middleware:${GITHUB_SHA::8}" --output none
