name: deploy-sga-azure-webapp
on:
  push: { branches: [ main ] }
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: guard
        run: |
          if [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No AZURE_CREDENTIALS secret - skipping deploy (no-op run)."; fi
      - uses: azure/login@v2
        if: steps.guard.outputs.run == 'true'
        with: { creds: '${{ secrets.AZURE_CREDENTIALS }}' }
      - name: Ensure webapp (idempotent)
        if: steps.guard.outputs.run == 'true'
        run: |
          az appservice plan create -n "${{ vars.SGA_PLAN }}" -g "${{ vars.AZURE_RG }}" --sku B1 --is-linux --output none 2>/dev/null || true
          az webapp create -n "${{ vars.AZURE_WEBAPP }}" -g "${{ vars.AZURE_RG }}" -p "${{ vars.SGA_PLAN }}" --runtime "NODE:22-lts" --output none 2>/dev/null || true
      - name: Bundle + deploy zip
        if: steps.guard.outputs.run == 'true'
        run: |
          cd webapp && zip -qr ../deploy-webapp.zip src package.json && cd ..
          az webapp deploy -n "${{ vars.AZURE_WEBAPP }}" -g "${{ vars.AZURE_RG }}" --src-path deploy-webapp.zip --type zip --output none
          az webapp restart -n "${{ vars.AZURE_WEBAPP }}" -g "${{ vars.AZURE_RG }}" --output none
      - name: Smoke /healthz
        if: steps.guard.outputs.run == 'true'
        run: |
          for i in $(seq 1 40); do
            C=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "https://${{ vars.AZURE_WEBAPP }}.azurewebsites.net/healthz" || echo 000)
            echo "attempt $i: $C"; [ "$C" = "200" ] && echo "WEBAPP LIVE" && exit 0; sleep 15
          done; exit 1
